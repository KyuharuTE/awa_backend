<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>awa | Make ARK Sign Great Again</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<style>
			:root {
				--primary-color: #00d2ff;
				--accent-color: #9d50bb;
				--tg-color: #24a1de;
				--bg-dark: #050505;
			}

			* {
				box-sizing: border-box;
			}

			body,
			html {
				margin: 0;
				padding: 0;
				font-family:
					"Inter",
					-apple-system,
					system-ui,
					sans-serif;
				background-color: var(--bg-dark);
				color: #ffffff;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				overflow-x: hidden;
				z-index: -2;
			}

			/* 动态背景网格 */
			.grid-bg {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-image:
					linear-gradient(
						rgba(0, 210, 255, 0.03) 1px,
						transparent 1px
					),
					linear-gradient(
						90deg,
						rgba(0, 210, 255, 0.03) 1px,
						transparent 1px
					);
				background-size: 50px 50px;
				z-index: -2;
			}

			.cursor-glow {
				position: fixed;
				width: 600px;
				height: 600px;
				background: radial-gradient(
					circle,
					rgba(0, 210, 255, 0.1) 0%,
					transparent 70%
				);
				border-radius: 50%;
				pointer-events: none;
				transform: translate(-50%, -50%);
				z-index: -1;
			}

			/* 核心卡片容器：适配手机与电脑 */
			.container {
				text-align: center;
				padding: 50px clamp(20px, 5vw, 60px);
				border-radius: 35px;
				background: rgba(15, 15, 20, 0.75);
				backdrop-filter: blur(35px);
				-webkit-backdrop-filter: blur(35px);
				border: 1px solid rgba(255, 255, 255, 0.12);
				box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
				width: 92%; /* 手机端宽度 */
				max-width: 800px; /* 电脑端最大宽度 */
				margin: 20px;
				animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
			}

			/* 针对电脑端的防缩团优化 */
			@media (min-width: 768px) {
				.container {
					width: 60%;
					min-width: 550px; /* 强制电脑端最小宽度 */
				}
			}

			@keyframes slideUp {
				from {
					opacity: 0;
					transform: translateY(30px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* Logo 区域样式 */
			.logo-area {
				margin-bottom: 20px;
			}
			.main-logo {
				width: 85px;
				height: auto;

				border-radius: 16px; /* 👈 圆角 */

				filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.6));
				transition: transform 0.3s ease;
			}
			.main-logo:hover {
				transform: scale(1.05);
			}

			h1 {
				font-size: 3rem;
				margin: 0;
				font-weight: 900;
				background: linear-gradient(
					90deg,
					#fff,
					var(--primary-color),
					var(--accent-color),
					#fff
				);
				background-size: 200% auto;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				animation: shine 4s linear infinite;
			}

			@keyframes shine {
				to {
					background-position: 200% center;
				}
			}

			.subtitle {
				font-size: 0.8rem;
				color: #888;
				margin-bottom: 30px;
				letter-spacing: 4px; /* 适当减小防止溢出 */
				text-transform: uppercase;
			}

			.login-section {
				margin-top: 35px;
				border-top: 1px solid rgba(255, 255, 255, 0.05);
				padding-top: 30px;
			}

			.input-group {
				margin-bottom: 15px;
				position: relative;
			}

			.input-field {
				width: 100%;
				padding: 16px 20px;
				background: rgba(255, 255, 255, 0.05);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 15px;
				color: #fff;
				font-size: 1rem;
				outline: none;
				transition: 0.3s;
			}

			.input-field:focus {
				background: rgba(255, 255, 255, 0.08);
				border-color: var(--primary-color);
				box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
			}

			.button-group {
				display: flex;
				flex-direction: column;
				gap: 15px;
			}

			.btn {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 12px;
				text-decoration: none;
				padding: 18px;
				border-radius: 18px;
				font-weight: 700;
				transition: all 0.3s ease;
				font-size: 1rem;
				border: none;
				cursor: pointer;
			}

			.btn-main {
				background: #fff;
				color: #000;
				box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
			}
			.btn-main:hover {
				transform: translateY(-3px);
				box-shadow: 0 15px 30px rgba(0, 210, 255, 0.4);
			}

			.btn-login {
				background: linear-gradient(
					135deg,
					var(--primary-color),
					var(--accent-color)
				);
				color: #fff;
				width: 100%;
			}

			.btn-sub {
				background: rgba(255, 255, 255, 0.03);
				color: #ccc;
				border: 1px solid rgba(255, 255, 255, 0.1);
			}
			.btn-sub:hover {
				background: rgba(36, 161, 222, 0.1);
				color: var(--tg-color);
				border-color: var(--tg-color);
			}

			footer {
				margin-top: 40px;
				font-size: 0.65rem;
				color: #444;
				letter-spacing: 2px;
			}

			/* From Uiverse.io by ernestnash */
			.btn2 {
				display: inline-block;
				padding: 0.9rem 1.8rem;
				font-size: 16px;
				font-weight: 700;
				color: white;
				border: 3px solid rgb(252, 70, 100);
				cursor: pointer;
				position: relative;
				background-color: transparent;
				text-decoration: none;
				overflow: hidden;
				z-index: 1;
				font-family: inherit;
			}

			.btn2::before {
				content: "";
				position: absolute;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background-color: rgb(252, 70, 100);
				transform: translateX(-100%);
				transition: all 0.3s;
				z-index: -1;
			}

			.btn2:hover::before {
				transform: translateX(0);
			}
		</style>
	</head>
	<body>
		<div class="grid-bg"></div>
		<div class="cursor-glow" id="glow"></div>

		<div class="container">
			<div class="logo-area">
				<img src="logo.png" alt="awa Logo" class="main-logo" />
			</div>

			<h1>awa</h1>
			<h2>你是嘿壳吗?</h2>
			<p class="subtitle">Make ARK Sign Great Again</p>

			<div class="button-group">
				<a href="" target="_blank" class="btn2">
					<i class="fab fa-telegram-plane"></i> 立即获取
				</a>
			</div>

			<footer>
				&copy; 2026 AWA.AFRIT.CN · ALL RIGHTS RESERVED
				<br />@Nacho
			</footer>
		</div>

		<script>
			const glow = document.getElementById("glow");
			window.addEventListener("mousemove", (e) => {
				glow.style.left = e.clientX + "px";
				glow.style.top = e.clientY + "px";
			});
		</script>

			crossorigin="anonymous"

	</body>
</html>
